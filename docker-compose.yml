version: '3.8'

services:
  upian-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upian-ai-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./vision_outputs:/app/vision_outputs
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
